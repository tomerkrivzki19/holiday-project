services:
  holiday-app:
    build:
      context: .
      dockerfile: Dockerfile

    image: holiday-app:latest

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
